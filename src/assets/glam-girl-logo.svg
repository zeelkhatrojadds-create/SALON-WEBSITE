<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 75" fill="none" width="280" height="75">
  <defs>
    <linearGradient id="ggForestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263D2B" />
      <stop offset="100%" stop-color="#465640" />
    </linearGradient>
  </defs>

  <!-- Left: Luxury Goddess Botanical Emblem (70x70) -->

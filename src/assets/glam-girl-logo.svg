    <!-- Hair waves -->
    <path d="M 26 23 C 22 28 22 40 27 48 C 24 41 25 31 28 26" stroke="url(#ggForestGrad)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 23 31 C 19 35 19 44 24 51 C 21 45 21 37 24 33" stroke="url(#ggForestGrad)" stroke-width="1.1" stroke-linecap="round" />
    <path d="M 44 23 C 48 28 48 40 43 48 C 46 41 45 31 42 26" stroke="url(#ggForestGrad)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 47 31 C 51 35 51 44 46 51 C 49 45 49 37 46 33" stroke="url(#ggForestGrad)" stroke-width="1.1" stroke-linecap="round" />

    <!-- Eyebrows -->
    <path d="M 28.5 30.5 Q 31.5 28 34 30" stroke="url(#ggForestGrad)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 36.5 30 Q 39 28 41.5 30.5" stroke="url(#ggForestGrad)" stroke-width="1.4" stroke-linecap="round" />

    <!-- Closed Eyes with Eyelashes -->
    <path d="M 28.5 35 Q 31.5 38.5 34 35" stroke="url(#ggForestGrad)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 29.5 36.5 L 27.5 38.5" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 31 37.5 L 30.5 40" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 33 36.5 L 34 39.5" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linecap="round" />

    <path d="M 36.5 35 Q 39 38.5 42 35" stroke="url(#ggForestGrad)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 37.5 36.5 L 36.5 39.5" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 39.5 37.5 L 40 40" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 41 36.5 L 43 38.5" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 35 31 L 35 40 Q 35 41.5 33.5 41.5 Q 35 42 36.5 41.5" stroke="url(#ggForestGrad)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Lips -->
    <path d="M 32.5 45.5 Q 35 44.5 37.5 45.5" stroke="url(#ggForestGrad)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 32.5 45.5 Q 35 48.5 37.5 45.5" stroke="url(#ggForestGrad)" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Right: Complete Brand Typography Lockup (Fills 90% space) -->
  <g transform="translate(86, 0)">
    <!-- GLAM GIRL -->
    <text
      x="0"
      y="42"
      font-family="'Playfair Display', Georgia, 'Cinzel', serif"
      font-size="28"
      font-weight="800"
      letter-spacing="3.2"
      fill="#10110F"
    >GLAM GIRL</text>

    <!-- BY JANKI -->
    <text
      x="2"
      y="62"
      font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="11.5"
      font-weight="800"
      letter-spacing="5.8"
      fill="#263D2B"
    >BY JANKI</text>
  </g>
</svg>

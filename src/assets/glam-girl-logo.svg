    <path
      d="M 35 5 A 30 30 0 1 0 53 60"
      stroke="url(#ggForestGrad)"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Right Wreath Branch -->
    <path
      d="M 53 60 C 59 52 61 43 60 34 C 58 25 53 17 45 10"
      stroke="url(#ggForestGrad)"
      stroke-width="1.6"
      stroke-linecap="round"
    />

    <!-- Leaves along the branch -->
    <path d="M 45 10 C 49 7 52 6 55 6 C 51 9 48 11 45 10 Z" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 50 16 C 54 13 58 11 60 11 C 56 14 52 16 50 16 Z" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 54 23 C 59 20 62 20 64 21 C 60 23 57 24 54 23 Z" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 58 31 C 64 30 67 31 68 33 C 64 33 60 33 58 31 Z" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 60 39 C 65 40 67 43 68 46 C 64 45 61 42 60 39 Z" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 57 47 C 62 50 63 54 62 57 C 59 54 57 50 57 47 Z" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 53 54 C 56 58 57 62 55 65 C 53 61 52 57 53 54 Z" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Inner small leaves -->
    <path d="M 54 28 C 51 25 49 24 48 25 C 50 28 52 29 54 28 Z" stroke="url(#ggForestGrad)" stroke-width="1" stroke-linejoin="round" />
    <path d="M 56 36 C 53 34 51 34 50 35 C 51 37 54 37 56 36 Z" stroke="url(#ggForestGrad)" stroke-width="1" stroke-linejoin="round" />
    <path d="M 53 45 C 50 44 48 45 48 47 C 50 48 51 47 53 45 Z" stroke="url(#ggForestGrad)" stroke-width="1" stroke-linejoin="round" />

    <!-- Bottom flourish -->
    <path d="M 53 60 C 47 65 40 66 33 66" stroke="url(#ggForestGrad)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Head Crown Leaves -->
    <path d="M 27 19 C 31 15 39 15 43 19" stroke="url(#ggForestGrad)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 35 16 C 33 10 38 8 41 7 C 40 12 37 14 35 16 Z" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 30 17 C 26 14 26 9 29 8 C 30 12 31 15 30 17 Z" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 40 17 C 44 14 46 10 47 9 C 45 12 43 15 40 17 Z" stroke="url(#ggForestGrad)" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Face Silhouette -->
    <path
      d="M 26 30 C 27 41 31 50 35 52 C 39 50 43 41 44 30"
      stroke="url(#ggForestGrad)"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
